<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://assets.keygen.sh/fonts/owners/keygen.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030a11" media="(prefers-color-scheme: dark)" />
    <title>Keygen</title>
    <script>
      try {
        var theme = localStorage.getItem("keygen.theme")
        var dark =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : theme !== "light"
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
